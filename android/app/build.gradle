plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def localProperties = new Properties()
def localPropertiesFile = [
    rootProject.file("local.properties"),
    rootProject.file("../local.properties")
].find { it.exists() }
if (localPropertiesFile != null) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def defaultApiBaseUrl = "http://192.168.18.10/IT140P-MP-MalayanQuest/backend/api/"
def apiBaseUrl = localProperties.getProperty("api.base.url", defaultApiBaseUrl)
def escapedApiBaseUrl = apiBaseUrl.replace("\\", "\\\\").replace('"', '\\"')

android {
    namespace "com.malayanquest.app"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.malayanquest.app"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "API_BASE_URL", "\"${escapedApiBaseUrl}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.15"
    }
}

dependencies {
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
}

configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}
